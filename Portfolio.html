<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio — MountainClicks</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <script src="https://use.fontawesome.com/db006bf474.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@200;300;400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --dark: #1a1a18;
            --gold: #c8a96e;
            --light: #f5f0e8;
            --mid: #3d3d38;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Jost', sans-serif;
            font-weight: 300;
            color: var(--dark);
            background: var(--light);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--gold);
        }

        /* NAV */
        #nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            padding: 18px 5%;
            display: flex;
            align-items: center;
            background: var(--dark);
            transition: 0.5s;
        }

        .nav-left,
        .nav-right {
            display: flex;
            align-items: center;
            gap: 28px;
            flex: 1;
        }

        .nav-right {
            justify-content: flex-end;
        }

        #nav a {
            font-size: 11px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            text-decoration: none;
            color: #ccc;
            transition: 0.3s;
        }

        #nav a:hover {
            color: var(--gold);
        }

        .brand-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
        }

        .btn-enquire {
            border: 1px solid var(--gold);
            padding: 7px 22px;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: transparent;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Jost', sans-serif;
            color: var(--gold);
        }

        .btn-enquire:hover {
            background: var(--gold);
            color: var(--dark);
        }

        /* SIDENAV */
        .sidenav {
            height: 100vh;
            width: 0;
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            background: var(--dark);
            overflow-x: hidden;
            transition: 0.5s;
            padding-top: 80px;
            font-family: 'Jost', sans-serif;
            letter-spacing: 3px;
        }

        .sidenav a {
            padding: 12px 32px;
            text-decoration: none;
            color: #ccc;
            display: block;
            font-size: 13px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .sidenav a:hover {
            color: var(--gold);
        }

        .sidenav .closebtn {
            position: absolute;
            top: 15px;
            right: 25px;
            font-size: 32px;
            color: #ccc;
        }

        /* MOBILE NAV */
        #navMob {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            background: var(--dark);
            padding: 14px 5%;
            align-items: center;
        }

        #navMob a {
            color: #ccc;
            text-decoration: none;
        }

        /* PAGE HERO */
        .page-hero {
            height: 50vh;
            background: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            margin-top: 0;
        }

        .page-hero h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(48px, 7vw, 90px);
            font-weight: 300;
            color: #fff;
            letter-spacing: 4px;
        }

        .page-hero p {
            font-size: 11px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--gold);
            margin-top: 12px;
        }

        .gold-line {
            width: 50px;
            height: 1px;
            background: var(--gold);
            margin: 16px auto;
        }

        /* FILTER TABS */
        .filter-tabs {
            text-align: center;
            padding: 50px 5% 30px;
        }

        .tab-btn {
            border: 1px solid var(--dark);
            background: transparent;
            padding: 8px 28px;
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-family: 'Jost', sans-serif;
            cursor: pointer;
            margin: 4px;
            transition: 0.3s;
        }

        .tab-btn:hover,
        .tab-btn.active {
            background: var(--dark);
            color: #fff;
        }

        /* GALLERY GRID */
        .gallery-section {
            padding: 20px 5% 80px;
        }

        .gallery-grid {
            columns: 3;
            gap: 12px;
        }

        .gallery-item {
            break-inside: avoid;
            margin-bottom: 12px;
            overflow: hidden;
            position: relative;
            height: 320px;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.03);
        }

        .gallery-item .ph {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #c8a96e22, #1a1a1844);
            border: 1px dashed #c8a96e55;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* FOOTER */
        .footer-banner {
            background: var(--gold);
            padding: 30px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }

        .footer-banner h4 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
            font-weight: 300;
            color: var(--dark);
            margin: 0;
        }

        .footer-banner .social-icons a {
            color: var(--dark);
            font-size: 20px;
            margin-left: 20px;
        }

        .footer-bottom {
            background: var(--dark);
            color: #999;
            padding: 30px 5%;
            text-align: center;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .footer-bottom a {
            color: var(--gold);
            text-decoration: none;
        }

        @media(max-width:768px) {
            #nav {
                display: none !important;
            }

            #navMob {
                display: flex !important;
            }

            .gallery-grid {
                columns: 2;
            }

            .gallery-item {
                height: 260px;
            }
        }

        @media(max-width:480px) {
            .gallery-grid {
                columns: 1;
            }

            .gallery-item {
                height: 220px;
            }
        }
    </style>
</head>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
    <script>
        function openNav() { document.getElementById("mySidenav").style.width = "100%"; }
        function closeNav() { document.getElementById("mySidenav").style.width = "0"; }
        function filterGallery(cat, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.gallery-item').forEach(item => {
                if (cat === 'all' || item.dataset.cat === cat) { item.style.display = 'block'; }
                else { item.style.display = 'none'; }
            });
        }
    </script>
